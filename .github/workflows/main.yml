name: Decompile Bundle with Wakaru

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  wakaru:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wakaru CLI
        run: npm install -g @wakaru/cli

      - name: Run Wakaru on bundle
        run: wakaru b/assets/bundle-2xkbiu9u.js --unpack -o decompiled/

      - name: Upload decompiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-code
          path: decompiled/
